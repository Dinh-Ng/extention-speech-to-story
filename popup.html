<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin-top: 0;
      text-align: center;
    }
    #content {
      width: 100%;
      height: 300px;
      border: 1px solid #ccc;
      padding: 5px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>Đọc truyện Speech</h3>
  <div id="content">Đang tải nội dung...</div>
  <div class="controls">
    <button id="speakBtn" disabled>▶ Đọc</button>
    <button id="pauseBtn" disabled>⏸ Tạm dừng</button>
    <button id="stopBtn" disabled>⏹ Dừng</button>
    <button id="reloadBtn">⟲ Tải lại</button>
  </div>
  <div class="status" id="status">Sẵn sàng</div>

  <script src="popup.js"></script>
</body>
</html>
